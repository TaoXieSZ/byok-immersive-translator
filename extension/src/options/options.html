<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>翻译服务设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">BYOK / 本地配置</p>
          <h1>把翻译服务<br>握在自己手里</h1>
        </div>
        <p class="lede">Token 只保存在这台设备。扩展不会建设中转服务器，也不会同步你的凭据。</p>
      </header>

      <section class="workspace">
        <aside class="provider-rail">
          <div class="rail-heading">
            <span>服务配置</span>
            <button id="new-custom" class="text-button" type="button">＋ 自定义</button>
          </div>
          <button id="new-deepseek" class="preset-button" type="button">
            <span class="preset-mark">D</span>
            <span><strong>新建 DeepSeek</strong><small>官方 OpenAI-compatible API</small></span>
          </button>
          <div id="provider-list" class="provider-list" aria-live="polite"></div>
        </aside>

        <form id="provider-form" class="editor" autocomplete="off">
          <input id="provider-id" type="hidden">
          <div class="editor-heading">
            <div>
              <p class="eyebrow">当前配置</p>
              <h2 id="editor-title">新建翻译服务</h2>
            </div>
            <span id="selected-badge" class="badge" hidden>正在使用</span>
          </div>

          <label>
            <span>服务名称</span>
            <input id="provider-name" required placeholder="例如：我的 DeepSeek">
          </label>
          <label>
            <span>Base URL</span>
            <input id="base-url" type="url" required placeholder="https://api.deepseek.com">
            <small>远程地址必须使用 HTTPS；本机 localhost 可以使用 HTTP。</small>
          </label>
          <div class="field-grid">
            <label>
              <span>模型</span>
              <input id="model" required placeholder="例如：deepseek-v4-flash">
            </label>
            <label>
              <span>目标语言</span>
              <input id="target-language" required value="简体中文">
            </label>
          </div>
          <label>
            <span>API Key</span>
            <input id="api-key" type="password" required spellcheck="false" placeholder="sk-••••••••">
            <small>建议创建独立、有限额的 Token。掌握本机浏览器调试权限的人仍可能读取它。</small>
          </label>
          <label class="check-row">
            <input id="json-mode" type="checkbox">
            <span><strong>启用 JSON response format</strong><small>DeepSeek 支持；不兼容的服务请关闭。</small></span>
          </label>

          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
          <div class="actions">
            <button id="test-provider" class="button button--ghost" type="button">测试连接</button>
            <button class="button button--primary" type="submit">保存并使用</button>
            <button id="delete-provider" class="button button--danger" type="button" hidden>删除</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="options.mjs"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>翻译当前页面</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark">译</div>
        <div>
          <p class="eyebrow">BYOK TRANSLATOR</p>
          <h1>双语阅读</h1>
        </div>
        <span id="status-dot" class="status-dot" title="空闲"></span>
      </header>

      <section class="provider-strip">
        <span>翻译服务</span>
        <strong id="provider-name">尚未配置</strong>
        <button id="open-options" type="button">设置</button>
      </section>

      <section class="progress-card">
        <div class="progress-heading">
          <p id="status-label">准备翻译当前页面</p>
          <span id="progress-fraction">0 / 0</span>
        </div>
        <div class="progress-track"><span id="progress-bar"></span></div>
        <div class="metrics">
          <span><strong id="metric-translated">0</strong> 已完成</span>
          <span><strong id="metric-active">0</strong> 处理中</span>
          <span><strong id="metric-failed">0</strong> 失败</span>
        </div>
      </section>

      <fieldset class="scope-picker">
        <legend>翻译范围</legend>
        <label>
          <input type="radio" name="translation-scope" value="main-content" checked>
          <span>主要内容</span>
        </label>
        <label>
          <input type="radio" name="translation-scope" value="full-page">
          <span>整个页面</span>
        </label>
      </fieldset>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <section class="primary-actions">
        <button id="start" class="button button--start" type="button">
          <span>开始翻译</span><kbd>当前页</kbd>
        </button>
        <button id="stop" class="button" type="button" disabled>停止</button>
        <button id="retry" class="button" type="button" disabled>重试失败</button>
        <button id="restore" class="button button--quiet" type="button" disabled>恢复原文</button>
      </section>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>

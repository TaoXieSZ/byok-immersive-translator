<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Translator browser fixture</title>
    <style>
      body { max-width: 680px; margin: 40px auto; font: 18px/1.65 Georgia, serif; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <article>
      <h1>A small article for browser verification</h1>
      <p>This paragraph should be translated while its original text remains untouched.</p>
      <blockquote><p>Nested candidates should only be translated once.</p></blockquote>
      <pre><code>console.log("code must not be translated");</code></pre>
      <p class="hidden">Hidden text must not be sent.</p>
      <label>Private form value <input value="must not be sent"></label>
      <ul><li>List items are semantic translation blocks.</li></ul>
    </article>
    <button id="append" type="button">Append dynamic paragraph</button>
    <script>
      document.querySelector("#append").addEventListener("click", () => {
        const paragraph = document.createElement("p");
        paragraph.textContent = "This paragraph arrived after the session started.";
        document.querySelector("article").append(paragraph);
      });
    </script>
  </body>
</html>
